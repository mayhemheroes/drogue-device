[package]
name = "drogue-device-fuzz"
version = "0.0.0"
publish = false
edition = "2018"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.drogue-device]
path = ".."
default-features = false
features = ["wifi+esp8266", "std"]

[patch.crates-io]
embassy = { path = "/embassy/embassy" }
embassy-embedded-hal = { path = "/embassy/embassy-embedded-hal" }
embassy-hal-common = { path = "/embassy/embassy-hal-common" }
ector = { path = "/ector/ector" }

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "esp8266_wifi_parse"
path = "fuzz_targets/esp8266_wifi_parse.rs"
test = false
doc = false
